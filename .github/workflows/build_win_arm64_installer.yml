---

# Unofficial native Windows on ARM (aarch64) installer, fork-only.
# Mirrors build_win_installer.yml, but builds in the MSYS2 CLANGARM64 environment on an ARM runner.
#
# EXPERIMENTAL variant: replaces GTK from MSYS2 with a patched GTK (native window frame on Windows,
# no black borders with Vulkan), built from the commit below.

name: Build Windows ARM64 Installer (experimental GTK)

env:
  GTK_REPO: https://gitlab.gnome.org/sci42/gtk.git
  GTK_COMMIT: 946348879847887c852f321e3c05b1f824718382

"on":
  push:
    branches: [experimental/gtk-native-frame]
    # documentation-only changes don't need a new installer
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "misc/**"
      - "LICENSE"
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-11-arm
    permissions:
      # needed for uploading release artifact
      contents: write
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Install Inno 6
        shell: pwsh
        run: |
          if (Test-Path "C:\Program Files (x86)\Inno Setup 6\") {
            echo "inno already installed"
          } else {
            winget install -e --id JRSoftware.InnoSetup -v 6.4.3 --accept-package-agreements `
              --accept-source-agreements --disable-interactivity --scope machine
            if (Test-Path "C:\Program Files (x86)\Inno Setup 6\") {
              echo "inno installed successfully"
            } else {
              throw "could not find inno's installation folder"
            }
          }

      - name: Set installer name
        id: set_installer_name
        shell: bash
        run: |
          echo "name=rnote-win-installer-$(echo ${GITHUB_REF_NAME#v} \
            | sed -e 's/[^A-Za-z0-9._-]/_/g')-aarch64-experimental-gtk" >> $GITHUB_OUTPUT

      - name: Setup MSYS2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          release: false
          update: true
          # saving the package cache fails on the ARM runner (paccache exit code 4)
          cache: false
          msystem: CLANGARM64
          install: |
            just

      - name: Install rustup
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe `
            -OutFile "$env:RUNNER_TEMP\rustup-init.exe"
          & "$env:RUNNER_TEMP\rustup-init.exe" -y --profile minimal --default-toolchain none `
            --default-host aarch64-pc-windows-gnullvm

      - name: Configure PATH
        run: echo "export PATH=$PATH:/c/Users/$USER/.cargo/bin:/c/Program\ Files\ \(x86\)/Inno\ Setup\ 6" > ~/.bashrc

      - name: Checkout
        uses: actions/checkout@v6

      - name: Prerequisites
        run: just ci=true prerequisites-win-arm64 1.99

      # Installed over the GTK package from MSYS2, so the installer picks up the patched libgtk
      - name: Build patched GTK
        run: |
          pacman -S --needed --noconfirm mingw-w64-clang-aarch64-shaderc mingw-w64-clang-aarch64-vulkan-headers
          gtk_dir="$(cygpath -u "$RUNNER_TEMP")/gtk"
          git clone --filter=blob:none "$GTK_REPO" "$gtk_dir"
          cd "$gtk_dir"
          git checkout --detach "$GTK_COMMIT"
          meson setup _build \
            --prefix="$(cygpath -m "$MSYSTEM_PREFIX")" \
            --buildtype=release \
            -Dintrospection=disabled -Ddocumentation=false -Dman-pages=false \
            -Dbuild-demos=false -Dbuild-examples=false -Dbuild-tests=false -Dbuild-testsuite=false \
            -Dmedia-gstreamer=disabled -Dvulkan=enabled
          ninja -C _build
          meson install -C _build --quiet

      - name: Setup
        run: |
          just ci=true msys_env_prefix_path="$(cygpath -m "$MSYSTEM_PREFIX")" \
            setup-win-installer '${{ steps.set_installer_name.outputs.name }}'

      - name: Build
        run: just ci=true build

      - name: Build installer
        run: just ci=true build-win-installer

      - name: Upload installer (workflow artifact)
        uses: actions/upload-artifact@v7
        with:
          name: rnote-win-arm64-experimental-gtk-installer-artifact
          path: _mesonbuild/${{ steps.set_installer_name.outputs.name }}.exe
          if-no-files-found: error

      - name: Upload installer (release asset)
        if: ${{ github.event_name == 'release' }}
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} _mesonbuild/${{ steps.set_installer_name.outputs.name }}.exe
